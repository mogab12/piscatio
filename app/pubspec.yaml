name: piscatio
description: "Piscatio - diário social de pescaria"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  exif: ^3.3.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  freezed_annotation: ^3.1.0
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  go_router: ^18.0.1
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: any
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/seed/
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-CourierPrime.txt
    - assets/fonts/OFL-Shrikhand.txt
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Archivo-SemiBoldItalic.ttf
          weight: 600
          style: italic
    - family: ArchivoExpanded
      fonts:
        - asset: assets/fonts/ArchivoExpanded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ArchivoExpanded-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/ArchivoExpanded-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/ArchivoExpanded-BlackItalic.ttf
          weight: 900
          style: italic
    - family: ArchivoCondensed
      fonts:
        - asset: assets/fonts/ArchivoCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/ArchivoCondensed-ExtraBold.ttf
          weight: 800
    # The wordmark only (the name next to the float).
    - family: Shrikhand
      fonts:
        - asset: assets/fonts/Shrikhand-Regular.ttf
    # Only for the specimen-tag card style (typed label).
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
          weight: 400
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
        - asset: assets/fonts/CourierPrime-Italic.ttf
          weight: 400
          style: italic
