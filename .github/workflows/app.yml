name: app

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Analyze, translations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib
          git diff --exit-code -- . || (echo "::error::Generated code is stale. Run build_runner and gen-l10n, then commit." && exit 1)

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Translations complete in pt, en and es
        run: dart run tool/check_l10n.dart

      - name: No hardcoded UI strings
        run: dart run tool/check_hardcoded_strings.dart

      - name: Tests
        run: flutter test --reporter=github

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # One fixed test key for every CI build, so each new APK installs over
      # the previous one (a fresh debug key per runner would block updates).
      # The keystore file is the secret; its password below only unlocks it.
      # The store (Play) key will be a different one.
      - name: Test signing key
        env:
          KEYSTORE_B64: ${{ secrets.PISCATIO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/piscatio-test.jks"
            echo "PISCATIO_KEYSTORE_PATH=$RUNNER_TEMP/piscatio-test.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::PISCATIO_KEYSTORE_B64 is not set; the APK is signed with a throwaway debug key and will not install over earlier builds."
          fi

      - name: Build APK (arm64)
        env:
          PISCATIO_KEYSTORE_PASSWORD: piscatio-test
          PISCATIO_KEY_ALIAS: piscatio-test
          PISCATIO_KEY_PASSWORD: piscatio-test
          # Server address baked into the build (repository variable
          # PISCATIO_API); the account screen can still change it.
          PISCATIO_API: ${{ vars.PISCATIO_API || 'https://piscatio-api.onrender.com' }}
          # Meta app id Instagram asks for when sharing to Stories (repository
          # variable FACEBOOK_APP_ID). Without it the app uses the share sheet.
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
        # The run number is the version code: every build is newer than the
        # last one, so Android offers it as an update.
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64 \
            --build-number=${{ github.run_number }} \
            --dart-define=PISCATIO_API="$PISCATIO_API" \
            --dart-define=FACEBOOK_APP_ID="$FACEBOOK_APP_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: piscatio-android-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
