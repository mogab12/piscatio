name: app

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Analyze, translations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib
          git diff --exit-code -- . || (echo "::error::Generated code is stale. Run build_runner and gen-l10n, then commit." && exit 1)

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Translations complete in pt, en and es
        run: dart run tool/check_l10n.dart

      - name: No hardcoded UI strings
        run: dart run tool/check_hardcoded_strings.dart

      - name: Tests
        run: flutter test --reporter=github

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build APK (arm64, signed with debug key)
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: piscatio-android-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
